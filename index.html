<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf1f4"><title>Organização do Casamento</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap head"><div><span class="eyebrow">PLANEJAMENTO COLABORATIVO</span><h1>💍 Nosso Casamento</h1><p>28 de novembro de 2026 · 15h · 80 convidados</p></div><div class="auth"><span id="syncStatus">Modo demonstração · dados neste navegador</span><button id="loginBtn" hidden>Entrar com Google</button><button id="logoutBtn" hidden>Sair</button></div></div></header><main class="wrap"><section class="stats"><div><strong id="progress">0%</strong><span>Concluído</span></div><div><strong id="done">0</strong><span>Concluídas</span></div><div><strong id="pending">0</strong><span>Pendentes</span></div><div><strong id="late">0</strong><span>Atrasadas</span></div></section><div class="progressbar"><div id="bar"></div></div><section class="toolbar"><input id="search" placeholder="Buscar atividade ou responsável..." aria-label="Buscar tarefas"><select id="frontFilter" aria-label="Filtrar frente"><option value="">Todas as frentes</option></select><select id="statusFilter" aria-label="Filtrar status"><option value="">Todos os status</option><option>Pendente</option><option>Em andamento</option><option>Concluída</option></select><button id="addBtn">+ Nova tarefa</button></section><section id="groups"></section><footer>Alterações sincronizadas entre participantes apenas após configurar Firebase e fazer login. <button id="exportBtn" class="link">Exportar JSON</button> · <button id="importBtn" class="link">Importar JSON</button><input id="importFile" type="file" accept="application/json" hidden></footer></main><dialog id="editor"><form id="taskForm"><h2 id="dialogTitle">Nova tarefa</h2><label>Atividade<input name="title" required maxlength="180"></label><label>Frente<select name="front" id="editFront" required></select></label><label>Responsável<input name="owner" placeholder="Nome do familiar" maxlength="90"></label><label>Prazo<input name="due" type="date"></label><label>Situação<select name="status"><option>Pendente</option><option>Em andamento</option><option>Concluída</option></select></label><label>Observações<textarea name="notes" rows="3" maxlength="1000"></textarea></label><div class="actions"><button type="button" id="deleteBtn" class="danger">Excluir</button><span></span><button type="button" id="cancelBtn">Cancelar</button><button type="submit" class="primary">Salvar</button></div></form></dialog><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
